<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Portfolio — Forecast 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #F5F1E6;
    --bg-alt: #EFE9D8;
    --surface: #FBF9F2;
    --surface-raised: #FFFFFF;
    --line: rgba(45,74,59,0.12);
    --line-strong: rgba(45,74,59,0.22);
    --ink: #24382C;
    --ink-dim: #5B6E5C;
    --ink-faint: #8B9A87;
    --forest: #24392B;
    --forest-deep: #16261B;
    --brass: #B08A4E;
    --clay: #B06A45;
    --sage: #7C9473;
    --sage-strong: #5C7A55;
    --red: #B0563A;
    --blue: #5B7F8F;
    --purple: #8B7A9C;
    --tan: #D9C6A5;
    --radius-s: 4px;
    --radius-m: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 750px 480px at -5% -8%, rgba(124,148,115,0.20), transparent 62%),
      radial-gradient(ellipse 620px 460px at 108% 4%, rgba(176,138,78,0.14), transparent 58%),
      radial-gradient(ellipse 680px 520px at -8% 96%, rgba(217,198,165,0.30), transparent 60%),
      radial-gradient(ellipse 620px 480px at 106% 100%, rgba(124,148,115,0.18), transparent 58%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection{ background: var(--brass); color:#FBF9F2; }
  .wrap{ max-width: 1240px; margin: 0 auto; padding: 40px 28px 80px; position:relative; z-index:1; }

  /* ---- decorative botanical corners ---- */
  .botanical{ position:fixed; pointer-events:none; z-index:0; opacity:0.9; }
  .botanical svg{ display:block; }
  .bot-tl{ top:-40px; left:-60px; width:340px; }
  .bot-br{ bottom:-60px; right:-70px; width:380px; transform:rotate(180deg); }
  @media (max-width: 760px){ .botanical{ width:220px !important; } }

  /* ---- Header ---- */
  header{ display:flex; justify-content:space-between; align-items:flex-end; gap: 24px; padding-bottom: 22px; flex-wrap: wrap; }
  .brandline{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size: 38px; letter-spacing: -0.01em; margin:0; color:var(--forest-deep); }
  .subtitle{ color: var(--ink-dim); font-size: 15.5px; margin-top: 6px; max-width: 52ch; line-height:1.55; }
  .yeartag{ font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--brass); border:1px solid rgba(176,138,78,0.4); padding: 3px 9px; border-radius: 999px; background:rgba(176,138,78,0.06); }

  .sync-panel{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .sync-row{ display:flex; align-items:center; gap:10px; }
  .sync-status{ font-size:13.5px; color: var(--ink-faint); font-family:'IBM Plex Mono', monospace; text-align:right; }
  .sync-status.ok{ color: var(--sage-strong); }
  .sync-status.err{ color: var(--red); }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--ink-faint); display:inline-block; margin-right:6px; }
  .dot.ok{ background: var(--sage-strong); box-shadow: 0 0 6px var(--sage-strong); }
  .dot.err{ background: var(--red); }
  .dot.loading{ background: var(--brass); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  button.refresh{ background: var(--forest); color: #FBF9F2; border: 1px solid var(--forest); padding: 10px 18px; border-radius: var(--radius-s); font-family:'IBM Plex Sans', sans-serif; font-size: 14.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition: background .15s ease, box-shadow .15s ease; box-shadow: 0 2px 8px rgba(36,57,43,0.18); }
  button.refresh:hover{ background: var(--forest-deep); }
  button.refresh:disabled{ opacity:.55; cursor:default; }
  button.refresh svg{ width:14px; height:14px; }
  .auto-toggle{ display:flex; align-items:center; gap:7px; font-size:13.5px; color: var(--ink-dim); cursor:pointer; user-select:none; }
  .auto-toggle input{ accent-color: var(--brass); }

  /* ---- Property tabs ---- */
  .tabbar{ display:flex; gap:6px; border-bottom:1px solid var(--line-strong); margin-bottom:28px; flex-wrap:wrap; position:relative; z-index:1; }
  .tab{ background:none; border:none; color:var(--ink-faint); font-family:'IBM Plex Sans',sans-serif; font-size:15.5px; font-weight:600; padding:12px 4px; margin-right:24px; cursor:pointer; position:relative; }
  .tab:hover{ color: var(--forest); }
  .tab.active{ color:var(--forest-deep); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: linear-gradient(90deg, var(--sage-strong), var(--brass)); }
  .tab .tab-note{ font-size:10.5px; font-weight:500; color:var(--red); margin-left:6px; vertical-align:2px; }

  /* ---- Hero ---- */
  .hero{ display:grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 860px){ .hero{ grid-template-columns: 1fr; } }
  .hero-main{ background: linear-gradient(150deg, #FFFFFF 0%, #F3EEE0 100%); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 30px 32px; position:relative; overflow:hidden; box-shadow: 0 4px 24px rgba(36,57,43,0.06); }
  .hero-main::after{ content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background: radial-gradient(circle, rgba(176,138,78,0.14), transparent 70%); }
  .hero-label{ font-size:14.5px; color: var(--ink-dim); margin-bottom: 10px; }
  .hero-number{ font-family:'Fraunces', serif; font-weight:600; font-size: 54px; color:var(--forest-deep); line-height:1; letter-spacing:-0.01em; }
  .hero-number small{ font-family:'IBM Plex Sans',sans-serif; font-size: 18.5px; color: var(--ink-dim); font-weight:500; margin-left:8px; }
  .hero-sub{ margin-top: 14px; display:flex; gap: 22px; flex-wrap:wrap; }
  .hero-sub div{ font-size:14.5px; color:var(--ink-dim); }
  .hero-sub b{ color:var(--forest); font-weight:600; }
  .progress-track{ margin-top:20px; height:7px; background: rgba(36,57,43,0.08); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--sage-strong), var(--brass)); border-radius:999px; transition: width .6s ease; }

  .hero-kpis{ display:grid; grid-template-rows: 1fr 1fr; gap: 20px; }
  .kpi-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding: 20px 24px; display:flex; flex-direction:column; justify-content:center; gap:6px; box-shadow: 0 2px 12px rgba(36,57,43,0.05); }
  .kpi-label{ font-size:14px; color: var(--ink-faint); }
  .kpi-value{ font-family:'Fraunces', serif; font-size: 31px; color:var(--forest-deep); font-weight:600; }
  .kpi-delta{ font-size:13.5px; }
  .kpi-delta.up{ color: var(--sage-strong); }
  .kpi-delta.down{ color: var(--red); }

  .section-title{ font-family:'Fraunces', serif; font-size:23px; font-weight:600; color:var(--forest-deep); margin: 44px 0 5px; }
  .section-desc{ font-size:14.5px; color: var(--ink-faint); margin-bottom:18px; }
  .panel{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding: 22px 24px; box-shadow: 0 2px 14px rgba(36,57,43,0.05); }
  .grid-2{ display:grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items:stretch; }
  @media (max-width: 900px){ .grid-2{ grid-template-columns: 1fr; } }
  .grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
  @media (max-width: 900px){ .grid-3{ grid-template-columns: 1fr; } }
  .chart-box{ position:relative; height: 300px; }
  .chart-box.tall{ height: 340px; }
  .chart-box.short{ height: 220px; }

  .legend-row{ display:flex; gap:18px; margin-top:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:14px; color:var(--ink-dim); }
  .legend-swatch{ width:10px; height:10px; border-radius:2px; }

  table.datatable{ width:100%; border-collapse:collapse; font-size:14.5px; }
  table.datatable th{ text-align:right; font-weight:600; color:var(--ink-faint); font-size:13px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space:nowrap; }
  table.datatable th:first-child, table.datatable td:first-child{ text-align:left; }
  table.datatable td{ text-align:right; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space:nowrap; color:var(--ink); }
  table.datatable tr:hover td{ background: rgba(124,148,115,0.06); }
  .badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .badge.hit{ background: rgba(92,122,85,0.14); color: var(--sage-strong); }
  .badge.miss{ background: rgba(176,86,58,0.12); color: var(--red); }
  .badge.na{ background: rgba(36,57,43,0.06); color: var(--ink-faint); }
  .badge.est{ background: rgba(176,138,78,0.14); color: var(--brass); }

  .channel-row{ display:flex; align-items:center; gap:12px; padding: 9px 0; }
  .channel-name{ width: 155px; font-size:14.5px; color:var(--ink); flex-shrink:0; }
  .channel-bar-track{ flex:1; height:9px; background: rgba(36,57,43,0.07); border-radius:999px; overflow:hidden; }
  .channel-bar-fill{ height:100%; border-radius:999px; }
  .channel-val{ width: 128px; text-align:right; font-size:13.5px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; box-shadow: 0 2px 12px rgba(36,57,43,0.05); }
  .stat-card .lbl{ font-size:13.5px; color:var(--ink-faint); margin-bottom:6px; }
  .stat-card .val{ font-family:'Fraunces',serif; font-size:27px; color:var(--forest-deep); font-weight:600; }
  .stat-card .sub{ font-size:13px; color:var(--ink-dim); margin-top:4px; }

  footer{ margin-top: 56px; padding-top: 20px; border-top:1px solid var(--line); font-size:13.5px; color: var(--ink-faint); line-height:1.75; }
  footer a{ color: var(--brass); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
  .setup-note{ background: rgba(176,138,78,0.08); border:1px solid rgba(176,138,78,0.28); border-radius: var(--radius-m); padding: 15px 19px; font-size: 14px; color: var(--ink-dim); line-height:1.65; margin-top:14px; }
  .setup-note b{ color: var(--brass); }
  .setup-note.warn{ background: rgba(176,86,58,0.07); border-color: rgba(176,86,58,0.28); }
  .setup-note.warn b{ color: var(--red); }

  /* ---- Password gate ---- */
  #gate{
    position:fixed; inset:0; background:var(--bg);
    background-image:
      radial-gradient(ellipse 750px 480px at -5% -8%, rgba(124,148,115,0.22), transparent 62%),
      radial-gradient(ellipse 620px 460px at 108% 4%, rgba(176,138,78,0.16), transparent 58%),
      radial-gradient(ellipse 680px 520px at -8% 96%, rgba(217,198,165,0.32), transparent 60%),
      radial-gradient(ellipse 620px 480px at 106% 100%, rgba(124,148,115,0.20), transparent 58%);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  #gate.hidden{ display:none; }
  .gate-box{ width:400px; max-width:90vw; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:40px 30px; box-shadow: 0 12px 40px rgba(36,57,43,0.12); position:relative; z-index:2; }
  .gate-box .gate-title{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:25px; color:var(--forest-deep); margin-bottom:6px; line-height:1.25; }
  .gate-box .gate-sub{ font-size:13.5px; color:var(--ink-dim); margin-bottom:24px; }
  .gate-logos{ display:flex; justify-content:center; align-items:center; gap:22px; margin-bottom:28px; flex-wrap:wrap; }
  .gate-logo-chip{ display:flex; align-items:center; justify-content:center; }
  .gate-logo-chip img{ display:block; height:58px; width:auto; filter: drop-shadow(0 2px 6px rgba(36,57,43,0.12)); }
  .gate-logo-chip.pera img{ height:44px; }
  .gate-box input{
    width:100%; background:#FFFFFF; border:1px solid var(--line-strong); color:var(--ink);
    padding:12px 14px; border-radius:var(--radius-s); font-family:'IBM Plex Mono',monospace; font-size:15px;
    text-align:center; letter-spacing:2px; margin-bottom:12px; outline:none;
  }
  .gate-box input:focus{ border-color:var(--brass); }
  .gate-box button{
    width:100%; background: linear-gradient(90deg, var(--sage-strong), var(--brass)); border:none; color:#FBF9F2;
    padding:12px 14px; border-radius:var(--radius-s); font-family:'IBM Plex Sans',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer;
  }
  .gate-box .gate-error{ font-size:12.5px; color:var(--red); margin-top:10px; min-height:16px; }
  #appRoot{ display:none; }
  #appRoot.visible{ display:block; }
</style>
</head>

function rp(n, compact){
  n = Math.round(n || 0);
  if(compact){
    if(Math.abs(n) >= 1e9) return "Rp" + (n/1e9).toFixed(2).replace(/\.00$/,'') + "M";
    if(Math.abs(n) >= 1e6) return "Rp" + (n/1e6).toFixed(0) + "jt";
    return "Rp" + n.toLocaleString('id-ID');
  }
  return "Rp" + n.toLocaleString('id-ID');
}
function pct(x){ return (x*100).toFixed(1).replace(/\.0$/,'') + "%"; }

/* ============ Tab bar ============ */
function renderTabs(){
  const tb = document.getElementById('tabbar');
  const labels = { ALL:"Semua Properti", PERA:"Pera One Villa", JBH:"Jarapa Beach House", RATU:"Ratu Village" };
  tb.innerHTML = PROP_KEYS.map(k => {
    const hasEstimate = k !== 'ALL' && state[k].summary.some(m => m.estimated);
    const note = hasEstimate ? '<span class="tab-note" title="Sebagian data bulan ini masih estimasi">⚠</span>' : '';
    return `<button class="tab ${k===currentTab?'active':''}" data-tab="${k}">${labels[k]}${note}</button>`;
  }).join('');
  tb.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderTabs(); renderContent(); });
  });
}

/* ============ Content router ============ */
function renderContent(){
  const el = document.getElementById('content');
  const footer = document.getElementById('footer');
  if(currentTab === 'ALL'){
    document.getElementById('pageTitle').textContent = "Villa Portfolio";
    document.getElementById('pageSubtitle').textContent = "Ringkasan performa gabungan Pera One Villa, Jarapa Beach House, dan Ratu Village.";
    el.innerHTML = allTemplate();
    renderAll();
    footer.innerHTML = footerAll();
  } else {
    const p = state[currentTab];
    document.getElementById('pageTitle').textContent = p.label;
    document.getElementById('pageSubtitle').textContent = `Performa reservasi & revenue ${p.villas.length} unit — ${p.villas.join(', ')}.`;
    el.innerHTML = propertyTemplate(currentTab);
    renderProperty(currentTab);
    footer.innerHTML = footerProperty(currentTab);
  }
}

/* ============ Property render ============ */
function renderProperty(key){
  const p = state[key];
  const s = p.summary;
  const totalNet = s.reduce((a,m)=>a+(m.net_revenue||0),0);
  const totalGross = s.reduce((a,m)=>a+(m.gross_revenue||0),0);
  const totalNights = s.reduce((a,m)=>a+(m.total_night||0),0);
  const avgOcc = s.reduce((a,m)=>a+(m.occupancy||0),0)/s.length;
  const avgAdr = totalNights ? totalGross/totalNights : 0;

  document.getElementById('heroRevenue').textContent = rp(totalNet);
  document.getElementById('heroAdr').textContent = rp(avgAdr);
  document.getElementById('kpiOcc').textContent = pct(avgOcc);
  document.getElementById('kpiNights').textContent = totalNights.toLocaleString('id-ID');
  document.getElementById('kpiNightsSub').textContent = 'sepanjang 2026 (' + s.filter(m=>m.total_night>0).length + ' bulan aktif)';
  document.getElementById('kpiOccDelta').textContent = '';

  if(key === 'PERA'){
    const totalTarget = p.annual_target || s.reduce((a,m)=>a+(m.target||0),0);
    const achievePct = totalTarget ? totalNet/totalTarget : 0;
    document.getElementById('heroRevenue').innerHTML = rp(totalNet) + `<small>/ target ${rp(totalTarget)}</small>`;
    document.getElementById('heroProgress').style.width = Math.min(100, achievePct*100).toFixed(1) + '%';
    document.getElementById('heroPct').textContent = pct(achievePct);
    document.getElementById('heroRemaining').textContent = rp(Math.max(0,totalTarget-totalNet));
  }

  renderRevenueChart(key, s);
  renderOccChart(key, s);
  renderVillaChart(key, p.villa_data, p.villas);
  renderChannels(p.source_rev, p.source_count);
  renderTable(key, s);
}

    datasets.push({ type:'line', label:'Target', data: target, borderColor:'#B08A4E', borderWidth:2, pointRadius:0, tension:0.35, borderDash:[5,4] });

  charts.revenue = new Chart(ctx, {
    data:{ labels, datasets },
    options:{
      ...baseGridOpts(), responsive:true, maintainAspectRatio:false,

/* ============ Live sync ============ */
function toNum(v){
  if(v===null||v===undefined) return 0;
  if(typeof v === 'number') return v;
  let str = String(v).trim();
  if(str === '' || str.includes('#REF') || str.includes('#VALUE') || str.includes('#DIV')) return 0;
  const isPct = str.includes('%');
  str = str.replace(/Rp/gi,'').replace(/[,\s%]/g,'');
  let n = parseFloat(str);
  if(isNaN(n)) return 0;
  if(isPct) n = n/100;
  return n;
}
function gvizUrl(sheetId, sheetName){
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}
function fetchSheetCsv(sheetId, sheetName){
  return fetch(gvizUrl(sheetId, sheetName)).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(text=>{
    if(text.trim().startsWith('<')) throw new Error('Not public / HTML returned');
    return Papa.parse(text, { skipEmptyLines:false }).data;
  });
}

async function parsePeraSummary(sheetId){
  const rows = await fetchSheetCsv(sheetId, 'SUMMARY P1 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Month');
  if(headerIdx === -1) throw new Error('Header tidak ditemukan');
  const out = [];
  for(let i=headerIdx+1;i<rows.length && out.length<12;i++){
    const r = rows[i];
    if(!r[0] || String(r[0]).trim()==='') break;
    out.push({ month:String(r[0]).trim(), occupancy:toNum(r[1]), total_night:toNum(r[2]), gross_revenue:toNum(r[5]), net_revenue:toNum(r[10]), target:toNum(r[11]) });
  }
  return out;
}
async function parsePeraOcc(sheetId){
  const rows = await fetchSheetCsv(sheetId, 'OCCUPANCY 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim().toLowerCase().startsWith('month'));
  const occ2025 = [];
  let annualTarget = null;
  if(headerIdx !== -1){
    for(let i=headerIdx+1;i<rows.length && occ2025.length<12;i++){
      const r = rows[i];
      if(!r[0] || String(r[0]).trim()==='') break;
      occ2025.push(toNum(r[5]));
      if(r[7] && String(r[7]).toLowerCase().includes('annual') && r[8]) annualTarget = toNum(r[8]);
    }
  }
  return { occ2025, annualTarget };
}
async function parsePeraMonthSheet(sheetId, monthName){
  const rows = await fetchSheetCsv(sheetId, monthName + ' 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Villa Name');
  if(headerIdx === -1) throw new Error('Sheet tidak sesuai format (Villa Name tidak ditemukan)');
  const dateRow = rows[headerIdx+1] || [];
  const dateRowMonth = dateRow[0] ? String(dateRow[0]).trim().toLowerCase() : '';
  if(dateRowMonth !== monthName.toLowerCase()){
    throw new Error(`Sheet "${monthName} 2026" tidak ditemukan — Google mengembalikan sheet lain ("${dateRow[0]||'?'}"). Melewati bulan ini.`);
  }
  const villas = {};
  let i = headerIdx+2;
  while(i<rows.length){
    const r = rows[i];
    const name = r[0] ? String(r[0]).trim() : '';
    if(!name || name === 'TOTAL ROOM') break;
    let cnt=0;
    for(let c=2;c<33 && c<r.length;c++){ if(r[c] && String(r[c]).trim()!=='') cnt++; }
    villas[name] = cnt; i++;
  }
  const guestIdx = rows.findIndex((r,idx) => idx>headerIdx && r[0] && String(r[0]).trim()==='Guest Name');
  const sources = {};
  if(guestIdx !== -1){
    let k = guestIdx+1;
    while(k<rows.length){
      const r = rows[k];
      const name = r[0] ? String(r[0]).trim() : '';
      if(!name){ k++; if(rows[k] && (!rows[k][0] || String(rows[k][0]).includes('Cancel'))) break; continue; }
      if(name.includes('Cancel') || name.includes('Room Sales')) break;
      const status = r[4] ? String(r[4]).trim() : '';
      const source = r[7] ? String(r[7]).trim() : '';
      const price = toNum(r[9]);
      if(status === 'CONFIRM' && source && price){ sources[source] = (sources[source]||0)+price; }
      k++;
    }
  }
  return { villas, sources };
}

function familyBMonthSheetName(monthIdx){
  return MONTHS_SHORT_SHEET[monthIdx] + ' 26';
}
async function parseFamilyBMonthSheet(sheetId, monthIdx){
  const rows = await fetchSheetCsv(sheetId, familyBMonthSheetName(monthIdx));
  let occ=0, nights=0, gross=0, net=0;
  const villas = {};
  const channels = ["AirBnB","Booking.com","Expedia","Agoda","Traveloka","Direct Booking (Web)","Direct Booking (WA)","Walk In"];
  const sources = {};
  const foundCh = new Set();

  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Room Name');
  if(headerIdx < 0) throw new Error('Sheet tidak sesuai format (Room Name tidak ditemukan)');

  // Guard against Google silently serving a different sheet when the requested
  // tab name doesn't exist: verify the date-row right after the header
  // actually starts with the expected month name before trusting this data.
  const dateRow = rows[headerIdx+1] || [];
  const expectedMonth = MONTHS[monthIdx].toLowerCase();
  const dateRowMonth = dateRow[0] ? String(dateRow[0]).trim().toLowerCase() : '';
  if(!dateRowMonth || !(dateRowMonth === expectedMonth || expectedMonth.startsWith(dateRowMonth) || dateRowMonth.startsWith(expectedMonth.slice(0,3)))){
    throw new Error(`Sheet "${familyBMonthSheetName(monthIdx)}" tidak ditemukan — Google mengembalikan sheet lain ("${dateRow[0]||'?'}"). Melewati bulan ini.`);
  }

  let i = headerIdx+2;
  while(i<rows.length){
    const r = rows[i];
    const name = r[0] ? String(r[0]).trim() : '';
    if(!name) break;
    const upper = name.toUpperCase();
    if(upper==='TOTAL ROOM' || upper.includes('TOTAL') || upper.includes('FORECAST')) break;
    let cnt=0;
    for(let c=2;c<33 && c<r.length;c++){ if(r[c] && String(r[c]).trim()!=='') cnt++; }
    villas[name] = cnt; i++;
  }
  for(const r of rows){
    for(let j=0;j<r.length;j++){
      const c = r[j];
      if(!c) continue;
      const s = String(c).trim();
      if(s.startsWith('% Occupancy')){
        if(j+1<r.length) occ = toNum(r[j+1]);
        for(let k2=j+1;k2<r.length;k2++){
          if(r[k2] && String(r[k2]).includes('Total room')){ if(k2+1<r.length) nights = toNum(r[k2+1]); }
        }
      }
      if(s==='Gross Revenue' || s==='Total Gross Revenue'){ if(j+1<r.length){ const v=toNum(r[j+1]); if(v) gross=v; } }
      if(s==='Net Revenue' || s==='Total Net Revenue R1' || s==='Net Revenue R1'){ if(j+1<r.length){ const v=toNum(r[j+1]); if(v) net=v; } }
      if(channels.includes(s) && !foundCh.has(s)){
        if(j+1<r.length){ const v=toNum(r[j+1]); if(v){ sources[s]=v; foundCh.add(s); } }
      }
    }
  }
  return { occ, nights, gross, net, villas, sources };
}

async function syncProperty(key){
  const p = state[key];
  if(key === 'PERA'){
    const [summary, occInfo] = await Promise.all([ parsePeraSummary(p.sheet_id), parsePeraOcc(p.sheet_id) ]);
    const villaData = {}; const sourceRev = {}; const sourceCount = {};
    const results = await Promise.allSettled(MONTHS.map(m => parsePeraMonthSheet(p.sheet_id, m)));
    results.forEach((res, idx) => {
      const m = MONTHS[idx];
      if(res.status==='fulfilled'){
        villaData[m] = res.value.villas;
        Object.entries(res.value.sources).forEach(([src,val])=>{ sourceRev[src]=(sourceRev[src]||0)+val; sourceCount[src]=(sourceCount[src]||0)+1; });
      } else { villaData[m] = (p.villa_data && p.villa_data[m]) || {}; }
    });
    p.summary = summary.map(s=>({...s, gross_revenue: s.gross_revenue}));
    p.occ2025 = occInfo.occ2025.length ? occInfo.occ2025 : p.occ2025;
    p.annual_target = occInfo.annualTarget || p.annual_target;
    if(Object.keys(villaData).length) p.villa_data = villaData;
    if(Object.keys(sourceRev).length){ p.source_rev = sourceRev; p.source_count = sourceCount; }
  } else {
    const results = await Promise.allSettled(MONTHS.map((m,idx) => parseFamilyBMonthSheet(p.sheet_id, idx)));
    const summary = []; const villaData = {}; const sourceRev = {}; const sourceCount = {};
    results.forEach((res, idx) => {
      const m = MONTHS[idx];
      if(res.status === 'fulfilled'){
        const v = res.value;
        summary.push({ month:m, occupancy:v.occ, total_night:v.nights, gross_revenue:v.gross, net_revenue:v.net, target:null });
        villaData[m] = v.villas;
        Object.entries(v.sources).forEach(([src,val])=>{ sourceRev[src]=(sourceRev[src]||0)+val; sourceCount[src]=(sourceCount[src]||0)+1; });
      } else {
        const prior = (p.summary || []).find(x=>x.month===m);
        summary.push(prior || { month:m, occupancy:0, total_night:0, gross_revenue:0, net_revenue:0, target:null });
        villaData[m] = (p.villa_data && p.villa_data[m]) || {};
      }
    });
    p.summary = summary;
    if(Object.keys(villaData).length) p.villa_data = villaData;
    if(Object.keys(sourceRev).length){ p.source_rev = sourceRev; p.source_count = sourceCount; }
  }
}

async function syncFromSheet(){
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('syncStatus');
  btn.disabled = true;
  statusEl.innerHTML = '<span class="dot loading"></span>Mengambil data terbaru…';
  statusEl.className = 'sync-status';
  const targets = currentTab === 'ALL' ? ['PERA','JBH','RATU'] : [currentTab];
  const results = await Promise.allSettled(targets.map(k => syncProperty(k)));
  const failed = results.filter(r=>r.status==='rejected');
  renderContent();
  const now = new Date();
  if(failed.length === 0){
    statusEl.innerHTML = `<span class="dot ok"></span>Tersinkron ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
    statusEl.className = 'sync-status ok';
  } else if(failed.length < targets.length){
    statusEl.innerHTML = `<span class="dot ok"></span>Sebagian tersinkron ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} (${failed.length} gagal)`;
    statusEl.className = 'sync-status ok';
  } else {
    statusEl.innerHTML = '<span class="dot err"></span>Gagal sinkron — sheet belum publik / download diblokir?';
    statusEl.className = 'sync-status err';
  }
  btn.disabled = false;
}

document.getElementById('refreshBtn').addEventListener('click', syncFromSheet);

let autoTimer = null;
function startAutoRefresh(){
  if(autoTimer) return;
  autoTimer = setInterval(syncFromSheet, 5*60*1000);
}
document.getElementById('autoToggle').addEventListener('change', (e)=>{
  if(!e.target.checked && autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  else if(e.target.checked){ startAutoRefresh(); syncFromSheet(); }
});

function initApp(){
  renderTabs();
  renderContent();
  document.getElementById('autoToggle').checked = true;
  startAutoRefresh();   // auto-refresh every 5 minutes, no click needed
  syncFromSheet();      // also pull fresh data immediately on load
}

/* ============ Password gate ============ */
const GATE_PASSWORD = "myXperience";
const gateEl = document.getElementById('gate');
const appRootEl = document.getElementById('appRoot');
const gatePasswordEl = document.getElementById('gatePassword');
const gateErrorEl = document.getElementById('gateError');

function unlockApp(){
  gateEl.classList.add('hidden');
  appRootEl.classList.add('visible');
  initApp();
}
function tryUnlock(){
  if(gatePasswordEl.value === GATE_PASSWORD){
    try{ sessionStorage.setItem('villaDashAuth','1'); }catch(e){}
    unlockApp();
  } else {
    gateErrorEl.textContent = 'Password salah, coba lagi.';
    gatePasswordEl.value = '';
    gatePasswordEl.focus();
  }
}
document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
gatePasswordEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });

let alreadyAuthed = false;
try{ alreadyAuthed = sessionStorage.getItem('villaDashAuth') === '1'; }catch(e){}
if(alreadyAuthed){ unlockApp(); } else { gatePasswordEl.focus(); }

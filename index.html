    --bg: #0E211D;
    --surface: #142E28;
    --surface-raised: #183630;
    --line: rgba(237,234,224,0.10);
    --line-strong: rgba(237,234,224,0.20);
    --ink: #EDEAE0;
    --ink-dim: #A9B8B1;
    --ink-faint: #74847D;
    --brass: #C99A4C;
    --clay: #C1613D;
    --sage: #7FAE97;
    --sage-strong: #9FCBB4;
    --red: #D2694F;
    --blue: #5B8FA8;
    --purple: #9C7FB8;
    --radius-s: 3px;
    --radius-m: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(127,174,151,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,154,76,0.08), transparent 55%);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection{ background: var(--brass); color:#0E211D; }
  .wrap{ max-width: 1240px; margin: 0 auto; padding: 40px 28px 80px; }

  /* ---- Header ---- */
  header{ display:flex; justify-content:space-between; align-items:flex-end; gap: 24px; padding-bottom: 22px; flex-wrap: wrap; }
  .brandline{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size: 32px; letter-spacing: -0.01em; margin:0; color:#fff; }
  .subtitle{ color: var(--ink-dim); font-size: 14px; margin-top: 6px; max-width: 50ch; line-height:1.5; }
  .yeartag{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--brass); border:1px solid rgba(201,154,76,0.35); padding: 3px 9px; border-radius: 999px; }

  .sync-panel{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .sync-row{ display:flex; align-items:center; gap:10px; }
  .sync-status{ font-size:12.5px; color: var(--ink-faint); font-family:'IBM Plex Mono', monospace; text-align:right; }
  .sync-status.ok{ color: var(--sage-strong); }
  .sync-status.err{ color: var(--red); }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--ink-faint); display:inline-block; margin-right:6px; }
  .dot.ok{ background: var(--sage-strong); box-shadow: 0 0 6px var(--sage-strong); }
  .dot.err{ background: var(--red); }
  .dot.loading{ background: var(--brass); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  button.refresh{ background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line-strong); padding: 9px 16px; border-radius: var(--radius-s); font-family:'IBM Plex Sans', sans-serif; font-size: 13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition: border-color .15s ease, background .15s ease; }
  button.refresh:hover{ border-color: var(--brass); background:#1B3F37; }
  button.refresh:disabled{ opacity:.55; cursor:default; }
  button.refresh svg{ width:14px; height:14px; }
  .auto-toggle{ display:flex; align-items:center; gap:7px; font-size:12.5px; color: var(--ink-dim); cursor:pointer; user-select:none; }
  .auto-toggle input{ accent-color: var(--brass); }

  /* ---- Property tabs ---- */
  .tabbar{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:28px; flex-wrap:wrap; }
  .tab{ background:none; border:none; color:var(--ink-faint); font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:600; padding:11px 4px; margin-right:22px; cursor:pointer; position:relative; }
  .tab:hover{ color: var(--ink); }
  .tab.active{ color:#fff; }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: linear-gradient(90deg, var(--sage), var(--brass)); }
  .tab .tab-note{ font-size:10.5px; font-weight:500; color:var(--red); margin-left:6px; vertical-align:2px; }

  /* ---- Hero ---- */
  .hero{ display:grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 860px){ .hero{ grid-template-columns: 1fr; } }
  .hero-main{ background: linear-gradient(150deg, #163832 0%, #10251F 100%); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 30px 32px; position:relative; overflow:hidden; }
  .hero-main::after{ content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background: radial-gradient(circle, rgba(201,154,76,0.18), transparent 70%); }
  .hero-label{ font-size:13px; color: var(--ink-dim); margin-bottom: 10px; }
  .hero-number{ font-family:'Fraunces', serif; font-weight:600; font-size: 48px; color:#fff; line-height:1; letter-spacing:-0.01em; }
  .hero-number small{ font-family:'IBM Plex Sans',sans-serif; font-size: 17px; color: var(--ink-dim); font-weight:500; margin-left:8px; }
  .hero-sub{ margin-top: 14px; display:flex; gap: 22px; flex-wrap:wrap; }
  .hero-sub div{ font-size:13px; color:var(--ink-dim); }
  .hero-sub b{ color:var(--ink); font-weight:600; }

  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--sage), var(--brass)); border-radius:999px; transition: width .6s ease; }

  .hero-kpis{ display:grid; grid-template-rows: 1fr 1fr; gap: 20px; }
  .kpi-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding: 20px 24px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .kpi-label{ font-size:12.5px; color: var(--ink-faint); }
  .kpi-value{ font-family:'Fraunces', serif; font-size: 27px; color:#fff; font-weight:600; }
  .kpi-delta{ font-size:12px; }
  .kpi-delta.up{ color: var(--sage-strong); }
  .kpi-delta.down{ color: var(--red); }

  .section-title{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; color:#fff; margin: 40px 0 4px; }
  .section-desc{ font-size:13px; color: var(--ink-faint); margin-bottom:16px; }
  .panel{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m); padding: 22px 24px; }
  .grid-2{ display:grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items:stretch; }
  @media (max-width: 900px){ .grid-2{ grid-template-columns: 1fr; } }
  .grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
  @media (max-width: 900px){ .grid-3{ grid-template-columns: 1fr; } }
  .chart-box{ position:relative; height: 300px; }
  .chart-box.tall{ height: 340px; }
  .chart-box.short{ height: 220px; }

  .legend-row{ display:flex; gap:18px; margin-top:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim); }
  .legend-swatch{ width:10px; height:10px; border-radius:2px; }

  table.datatable{ width:100%; border-collapse:collapse; font-size:13px; }
  table.datatable th{ text-align:right; font-weight:600; color:var(--ink-faint); font-size:11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space:nowrap; }
  table.datatable th:first-child, table.datatable td:first-child{ text-align:left; }
  table.datatable td{ text-align:right; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space:nowrap; }
  table.datatable tr:hover td{ background: rgba(255,255,255,0.02); }
  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.hit{ background: rgba(127,174,151,0.16); color: var(--sage-strong); }
  .badge.miss{ background: rgba(210,105,79,0.16); color: var(--red); }
  .badge.na{ background: rgba(255,255,255,0.06); color: var(--ink-faint); }
  .badge.est{ background: rgba(201,154,76,0.14); color: var(--brass); }

  .channel-bar-fill{ height:100%; border-radius:999px; }
  .channel-val{ width: 118px; text-align:right; font-size:12.5px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; }
  .stat-card .lbl{ font-size:12px; color:var(--ink-faint); margin-bottom:6px; }
  .stat-card .val{ font-family:'Fraunces',serif; font-size:24px; color:#fff; font-weight:600; }
  .stat-card .sub{ font-size:11.5px; color:var(--ink-dim); margin-top:4px; }

  footer a{ color: var(--brass); text-decoration:none; }

  .setup-note{ background: rgba(201,154,76,0.07); border:1px solid rgba(201,154,76,0.25); border-radius: var(--radius-m); padding: 14px 18px; font-size: 12.5px; color: var(--ink-dim); line-height:1.6; margin-top:14px; }
  .setup-note b{ color: var(--brass); }
  .setup-note.warn{ background: rgba(210,105,79,0.08); border-color: rgba(210,105,79,0.3); }
  .setup-note.warn b{ color: var(--red); }
</style>

function rp(n, compact){
  n = Math.round(n || 0);
  if(compact){
    if(Math.abs(n) >= 1e9) return "Rp" + (n/1e9).toFixed(2).replace(/\.00$/,'') + "M";
    if(Math.abs(n) >= 1e6) return "Rp" + (n/1e6).toFixed(0) + "jt";
    return "Rp" + n.toLocaleString('id-ID');
  }
  return "Rp" + n.toLocaleString('id-ID');
}
function pct(x){ return (x*100).toFixed(1).replace(/\.0$/,'') + "%"; }
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

/* ============ Tab bar ============ */
function renderTabs(){
  const tb = document.getElementById('tabbar');
  const labels = { ALL:"Semua Properti", PERA:"Pera One Villa", JBH:"Jarapa Beach House", RATU:"Ratu Village" };
  tb.innerHTML = PROP_KEYS.map(k => {
    const note = (k==='JBH') ? '<span class="tab-note">⚠</span>' : '';
    return `<button class="tab ${k===currentTab?'active':''}" data-tab="${k}">${labels[k]}${note}</button>`;
  }).join('');
  tb.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderTabs(); renderContent(); });
  });
}

/* ============ Content router ============ */
function renderContent(){
  const el = document.getElementById('content');
  const footer = document.getElementById('footer');
  if(currentTab === 'ALL'){
    document.getElementById('pageTitle').textContent = "Villa Portfolio";
    document.getElementById('pageSubtitle').textContent = "Ringkasan performa gabungan Pera One Villa, Jarapa Beach House, dan Ratu Village.";
    el.innerHTML = allTemplate();
    renderAll();
    footer.innerHTML = footerAll();
  } else {
    const p = state[currentTab];
    document.getElementById('pageTitle').textContent = p.label;
    document.getElementById('pageSubtitle').textContent = `Performa reservasi & revenue ${p.villas.length} unit — ${p.villas.join(', ')}.`;
    el.innerHTML = propertyTemplate(currentTab);
    renderProperty(currentTab);
    footer.innerHTML = footerProperty(currentTab);
  }
}

/* ============ Property render ============ */
function renderProperty(key){
  const p = state[key];
  const s = p.summary;
  const totalNet = s.reduce((a,m)=>a+(m.net_revenue||0),0);
  const totalGross = s.reduce((a,m)=>a+(m.gross_revenue||0),0);
  const totalNights = s.reduce((a,m)=>a+(m.total_night||0),0);
  const avgOcc = s.reduce((a,m)=>a+(m.occupancy||0),0)/s.length;
  const avgAdr = totalNights ? totalGross/totalNights : 0;

  document.getElementById('heroRevenue').textContent = rp(totalNet);
  document.getElementById('heroAdr').textContent = rp(avgAdr);
  document.getElementById('kpiOcc').textContent = pct(avgOcc);
  document.getElementById('kpiNights').textContent = totalNights.toLocaleString('id-ID');
  document.getElementById('kpiNightsSub').textContent = 'sepanjang 2026 (' + s.filter(m=>m.total_night>0).length + ' bulan aktif)';
  document.getElementById('kpiOccDelta').textContent = '';

  if(key === 'PERA'){
    const totalTarget = p.annual_target || s.reduce((a,m)=>a+(m.target||0),0);
    const achievePct = totalTarget ? totalNet/totalTarget : 0;
    document.getElementById('heroRevenue').innerHTML = rp(totalNet) + `<small>/ target ${rp(totalTarget)}</small>`;
    document.getElementById('heroProgress').style.width = Math.min(100, achievePct*100).toFixed(1) + '%';
    document.getElementById('heroPct').textContent = pct(achievePct);
    document.getElementById('heroRemaining').textContent = rp(Math.max(0,totalTarget-totalNet));
  }

  renderRevenueChart(key, s);
  renderOccChart(key, s);
  renderVillaChart(key, p.villa_data, p.villas);
  renderChannels(p.source_rev, p.source_count);
  renderTable(key, s);
}

function baseGridOpts(){
  return {
    scales:{
      x:{ grid:{ display:false }, ticks:{ color:'#A9B8B1', font:{ family:"'IBM Plex Sans'", size:11.5 } } },
      y:{ grid:{ color:'rgba(237,234,224,0.07)' }, ticks:{ color:'#A9B8B1', font:{ family:"'IBM Plex Sans'", size:11 } }, border:{display:false} }
    },
    plugins:{ legend:{ display:false } }
  };
}

function renderRevenueChart(key, s){
  const ctx = document.getElementById('revenueChart');
  const labels = s.map(m=>m.month.trim().slice(0,3));
  const rev = s.map(m=>m.net_revenue||0);
  const target = s.map(m=>m.target||0);
  const hasTarget = key === 'PERA';
  destroyChart('revenue');
  const datasets = [
    { type:'bar', label:'Net Revenue', data: rev, backgroundColor: rev.map((v,i)=> (hasTarget && v>=target[i]) ? 'rgba(127,174,151,0.85)' : 'rgba(127,174,151,0.6)'), borderRadius:4, maxBarThickness: 34 }
  ];
  if(hasTarget){
    datasets.push({ type:'line', label:'Target', data: target, borderColor:'#C99A4C', borderWidth:2, pointRadius:0, tension:0.35, borderDash:[5,4] });
  }
  charts.revenue = new Chart(ctx, {
    data:{ labels, datasets },
    options:{
      ...baseGridOpts(), responsive:true, maintainAspectRatio:false,
      scales:{ ...baseGridOpts().scales, y:{ ...baseGridOpts().scales.y, ticks:{ ...baseGridOpts().scales.y.ticks, callback:(v)=>rp(v,true) } } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=> c.dataset.label + ': ' + rp(c.raw) } } }
    }
  });
}

function renderOccChart(key, s){
  const ctx = document.getElementById('occChart');
  destroyChart('occ');
  const occ2026 = s.map(m=>(m.occupancy||0)*100);
  const datasets = [{ label:'2026', data: occ2026, borderColor: PROP_COLOR[key], backgroundColor: PROP_COLOR[key]+'22', pointRadius:0, borderWidth:2.5, tension:0.35, fill:true }];
  if(key === 'PERA' && state.PERA.occ2025){
    datasets.unshift({ label:'2025', data: state.PERA.occ2025.map(v=>v*100), borderColor:'#74847D', backgroundColor:'transparent', pointRadius:0, borderWidth:2, tension:0.35 });
  }
  charts.occ = new Chart(ctx, {
    type:'line',
    data:{ labels: MONTHS_ID, datasets },
    options:{
      ...baseGridOpts(), responsive:true, maintainAspectRatio:false,
      scales:{ ...baseGridOpts().scales, y:{ ...baseGridOpts().scales.y, ticks:{ ...baseGridOpts().scales.y.ticks, callback:(v)=>v+'%' }, min:0 } },
      plugins:{ legend:{ display: datasets.length>1, position:'top', align:'end', labels:{color:'#A9B8B1'} }, tooltip:{ callbacks:{ label:(c)=> c.dataset.label + ': ' + c.raw.toFixed(1) + '%' } } }
    }
  });
}

function renderVillaChart(key, villaData, villaList){
  const ctx = document.getElementById('villaChart');
  destroyChart('villa');
  const datasets = villaList.map((v,i) => ({
    label: v, data: MONTHS.map(m => (villaData[m] && villaData[m][v]) || 0),
    backgroundColor: VILLA_COLOR_PALETTE[i % VILLA_COLOR_PALETTE.length], borderRadius: 3, maxBarThickness: 16
  }));
  charts.villa = new Chart(ctx, {
    type:'bar',
    data:{ labels: MONTHS_ID, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#A9B8B1', font:{ family:"'IBM Plex Sans'", size:11.5 } } },
        y:{ grid:{ color:'rgba(237,234,224,0.07)' }, ticks:{ color:'#A9B8B1' }, border:{display:false} }
      },
      plugins:{ legend:{ position:'top', align:'end', labels:{ color:'#A9B8B1', boxWidth:10, boxHeight:10, font:{ family:"'IBM Plex Sans'", size:12 } } } }
    }
  });
}

function renderChannels(sourceRev, sourceCount){
  const el = document.getElementById('channelList');
  const entries = Object.entries(sourceRev || {}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ el.innerHTML = '<div style="color:var(--ink-faint); font-size:13px;">Belum ada data channel untuk properti ini.</div>'; return; }
  const max = Math.max(...entries.map(e=>e[1]), 1);
  el.innerHTML = entries.map(([name,val], i) => `
    <div class="channel-row">
      <div class="channel-name">${name}</div>
      <div class="channel-bar-track"><div class="channel-bar-fill" style="width:${(val/max*100).toFixed(1)}%; background:${CHANNEL_COLORS[i % CHANNEL_COLORS.length]}"></div></div>
      <div class="channel-val">${rp(val,true)}${sourceCount && sourceCount[name] ? ' · '+sourceCount[name]+'x' : ''}</div>
    </div>
  `).join('');
}

function renderTable(key, s){
  const tb = document.getElementById('tableBody');
  const hasTarget = key === 'PERA';
  tb.innerHTML = s.map(m => {
    let extraCols = '';
    if(hasTarget){
      const hit = m.target ? (m.net_revenue >= m.target) : false;
      extraCols = `<td>${rp(m.target||0)}</td><td><span class="badge ${hit?'hit':'miss'}">${m.target ? pct(m.net_revenue/m.target) : '—'}</span></td>`;
    } else if(m.estimated){
      extraCols = '';
    }
    return `<tr>
      <td>${m.month.trim()}${m.estimated?' <span class="badge est">estimasi</span>':''}</td>
      <td>${pct(m.occupancy||0)}</td>
      <td>${(m.total_night||0)}</td>
      <td>${rp(m.gross_revenue||0)}</td>
      <td>${rp(m.net_revenue||0)}</td>
      ${extraCols}
    </tr>`;
  }).join('');
}

/* ============ All-properties render ============ */

    totalNet += s.reduce((a,m)=>a+(m.net_revenue||0),0);
    totalNights += s.reduce((a,m)=>a+(m.total_night||0),0);
    s.forEach(m=>{ if(m.occupancy){ occSum += m.occupancy; occCount++; } });
  });

  document.getElementById('allProps').textContent = keys.map(k=>state[k].label).join(' · ');
  document.getElementById('allNights').textContent = totalNights.toLocaleString('id-ID');
  document.getElementById('allOcc').textContent = pct(occCount ? occSum/occCount : 0);

      },

  destroyChart('allOcc');

      borderColor: PROP_COLOR[k], backgroundColor:'transparent', pointRadius:0, borderWidth:2.5, tension:0.35
    })) },
    options:{
      ...baseGridOpts(), responsive:true, maintainAspectRatio:false,

  const sc = document.getElementById('statCards');

    const occAvg = s.reduce((a,m)=>a+(m.occupancy||0),0)/s.length;
    return `<div class="stat-card">

/* ============ Live sync ============ */
function toNum(v){
  if(v===null||v===undefined) return 0;
  if(typeof v === 'number') return v;
  let str = String(v).trim();
  if(str === '' || str.includes('#REF') || str.includes('#VALUE') || str.includes('#DIV')) return 0;
  const isPct = str.includes('%');
  str = str.replace(/Rp/gi,'').replace(/[,\s%]/g,'');
  let n = parseFloat(str);
  if(isNaN(n)) return 0;
  if(isPct) n = n/100;
  return n;
}
function gvizUrl(sheetId, sheetName){
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}
function fetchSheetCsv(sheetId, sheetName){
  return fetch(gvizUrl(sheetId, sheetName)).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(text=>{
    if(text.trim().startsWith('<')) throw new Error('Not public / HTML returned');
    return Papa.parse(text, { skipEmptyLines:false }).data;
  });
}

async function parsePeraSummary(sheetId){
  const rows = await fetchSheetCsv(sheetId, 'SUMMARY P1 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Month');
  if(headerIdx === -1) throw new Error('Header tidak ditemukan');
  const out = [];
  for(let i=headerIdx+1;i<rows.length && out.length<12;i++){
    const r = rows[i];
    if(!r[0] || String(r[0]).trim()==='') break;
    out.push({ month:String(r[0]).trim(), occupancy:toNum(r[1]), total_night:toNum(r[2]), gross_revenue:toNum(r[5]), net_revenue:toNum(r[10]), target:toNum(r[11]) });
  }
  return out;
}
async function parsePeraOcc(sheetId){
  const rows = await fetchSheetCsv(sheetId, 'OCCUPANCY 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim().toLowerCase().startsWith('month'));
  const occ2025 = [];
  let annualTarget = null;
  if(headerIdx !== -1){
    for(let i=headerIdx+1;i<rows.length && occ2025.length<12;i++){
      const r = rows[i];
      if(!r[0] || String(r[0]).trim()==='') break;
      occ2025.push(toNum(r[5]));
      if(r[7] && String(r[7]).toLowerCase().includes('annual') && r[8]) annualTarget = toNum(r[8]);
    }
  }
  return { occ2025, annualTarget };
}
async function parsePeraMonthSheet(sheetId, monthName){
  const rows = await fetchSheetCsv(sheetId, monthName + ' 2026');
  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Villa Name');
  if(headerIdx === -1) return { villas:{}, sources:{} };
  const villas = {};
  let i = headerIdx+2;
  while(i<rows.length){
    const r = rows[i];
    const name = r[0] ? String(r[0]).trim() : '';
    if(!name || name === 'TOTAL ROOM') break;
    let cnt=0;
    for(let c=2;c<33 && c<r.length;c++){ if(r[c] && String(r[c]).trim()!=='') cnt++; }
    villas[name] = cnt; i++;
  }
  const guestIdx = rows.findIndex((r,idx) => idx>headerIdx && r[0] && String(r[0]).trim()==='Guest Name');
  const sources = {};
  if(guestIdx !== -1){
    let k = guestIdx+1;
    while(k<rows.length){
      const r = rows[k];
      const name = r[0] ? String(r[0]).trim() : '';
      if(!name){ k++; if(rows[k] && (!rows[k][0] || String(rows[k][0]).includes('Cancel'))) break; continue; }
      if(name.includes('Cancel') || name.includes('Room Sales')) break;
      const status = r[4] ? String(r[4]).trim() : '';
      const source = r[7] ? String(r[7]).trim() : '';
      const price = toNum(r[9]);
      if(status === 'CONFIRM' && source && price){ sources[source] = (sources[source]||0)+price; }
      k++;
    }
  }
  return { villas, sources };
}

function familyBMonthSheetName(monthIdx){
  return MONTHS_SHORT_SHEET[monthIdx] + ' 26';
}
async function parseFamilyBMonthSheet(sheetId, monthIdx){
  const rows = await fetchSheetCsv(sheetId, familyBMonthSheetName(monthIdx));
  let occ=0, nights=0, gross=0, net=0;
  const villas = {};
  const channels = ["AirBnB","Booking.com","Expedia","Agoda","Traveloka","Direct Booking (Web)","Direct Booking (WA)","Walk In"];
  const sources = {};
  const foundCh = new Set();

  const headerIdx = rows.findIndex(r => r[0] && String(r[0]).trim() === 'Room Name');
  if(headerIdx >= 0){
    let i = headerIdx+2;
    while(i<rows.length){
      const r = rows[i];
      const name = r[0] ? String(r[0]).trim() : '';
      if(!name) break;
      const upper = name.toUpperCase();
      if(upper==='TOTAL ROOM' || upper.includes('TOTAL') || upper.includes('FORECAST')) break;
      let cnt=0;
      for(let c=2;c<33 && c<r.length;c++){ if(r[c] && String(r[c]).trim()!=='') cnt++; }
      villas[name] = cnt; i++;
    }
  }
  for(const r of rows){
    for(let j=0;j<r.length;j++){
      const c = r[j];
      if(!c) continue;
      const s = String(c).trim();
      if(s.startsWith('% Occupancy')){
        if(j+1<r.length) occ = toNum(r[j+1]);
        for(let k2=j+1;k2<r.length;k2++){
          if(r[k2] && String(r[k2]).includes('Total room')){ if(k2+1<r.length) nights = toNum(r[k2+1]); }
        }
      }
      if(s==='Gross Revenue' || s==='Total Gross Revenue'){ if(j+1<r.length){ const v=toNum(r[j+1]); if(v) gross=v; } }
      if(s==='Net Revenue' || s==='Total Net Revenue R1' || s==='Net Revenue R1'){ if(j+1<r.length){ const v=toNum(r[j+1]); if(v) net=v; } }
      if(channels.includes(s) && !foundCh.has(s)){
        if(j+1<r.length){ const v=toNum(r[j+1]); if(v){ sources[s]=v; foundCh.add(s); } }
      }
    }
  }
  return { occ, nights, gross, net, villas, sources };
}

async function syncProperty(key){
  const p = state[key];
  if(key === 'PERA'){
    const [summary, occInfo] = await Promise.all([ parsePeraSummary(p.sheet_id), parsePeraOcc(p.sheet_id) ]);
    const villaData = {}; const sourceRev = {}; const sourceCount = {};
    const results = await Promise.allSettled(MONTHS.map(m => parsePeraMonthSheet(p.sheet_id, m)));
    results.forEach((res, idx) => {
      const m = MONTHS[idx];
      if(res.status==='fulfilled'){
        villaData[m] = res.value.villas;
        Object.entries(res.value.sources).forEach(([src,val])=>{ sourceRev[src]=(sourceRev[src]||0)+val; sourceCount[src]=(sourceCount[src]||0)+1; });
      } else { villaData[m] = (p.villa_data && p.villa_data[m]) || {}; }
    });
    p.summary = summary.map(s=>({...s, gross_revenue: s.gross_revenue}));
    p.occ2025 = occInfo.occ2025.length ? occInfo.occ2025 : p.occ2025;
    p.annual_target = occInfo.annualTarget || p.annual_target;
    if(Object.keys(villaData).length) p.villa_data = villaData;
    if(Object.keys(sourceRev).length){ p.source_rev = sourceRev; p.source_count = sourceCount; }
  } else {
    const results = await Promise.allSettled(MONTHS.map((m,idx) => parseFamilyBMonthSheet(p.sheet_id, idx)));
    const summary = []; const villaData = {}; const sourceRev = {}; const sourceCount = {};
    results.forEach((res, idx) => {
      const m = MONTHS[idx];
      if(res.status === 'fulfilled'){
        const v = res.value;
        summary.push({ month:m, occupancy:v.occ, total_night:v.nights, gross_revenue:v.gross, net_revenue:v.net, target:null });
        villaData[m] = v.villas;
        Object.entries(v.sources).forEach(([src,val])=>{ sourceRev[src]=(sourceRev[src]||0)+val; sourceCount[src]=(sourceCount[src]||0)+1; });
      } else {
        const prior = (p.summary || []).find(x=>x.month===m);
        summary.push(prior || { month:m, occupancy:0, total_night:0, gross_revenue:0, net_revenue:0, target:null });
        villaData[m] = (p.villa_data && p.villa_data[m]) || {};
      }
    });
    p.summary = summary;
    if(Object.keys(villaData).length) p.villa_data = villaData;
    if(Object.keys(sourceRev).length){ p.source_rev = sourceRev; p.source_count = sourceCount; }
  }
}

async function syncFromSheet(){
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('syncStatus');
  btn.disabled = true;
  statusEl.innerHTML = '<span class="dot loading"></span>Mengambil data terbaru…';
  statusEl.className = 'sync-status';
  const targets = currentTab === 'ALL' ? ['PERA','JBH','RATU'] : [currentTab];
  const results = await Promise.allSettled(targets.map(k => syncProperty(k)));
  const failed = results.filter(r=>r.status==='rejected');
  renderContent();
  const now = new Date();
  if(failed.length === 0){
    statusEl.innerHTML = `<span class="dot ok"></span>Tersinkron ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
    statusEl.className = 'sync-status ok';
  } else if(failed.length < targets.length){
    statusEl.innerHTML = `<span class="dot ok"></span>Sebagian tersinkron ${now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} (${failed.length} gagal)`;
    statusEl.className = 'sync-status ok';
  } else {
    statusEl.innerHTML = '<span class="dot err"></span>Gagal sinkron — sheet belum publik / download diblokir?';
    statusEl.className = 'sync-status err';
  }
  btn.disabled = false;
}

document.getElementById('refreshBtn').addEventListener('click', syncFromSheet);
let autoTimer = null;
document.getElementById('autoToggle').addEventListener('change', (e)=>{
  if(e.target.checked){ autoTimer = setInterval(syncFromSheet, 5*60*1000); syncFromSheet(); }
  else if(autoTimer){ clearInterval(autoTimer); }
});

renderTabs();
renderContent();
